name: Make smoke

# Manual-only: a real `make build-linux` end-to-end, so the Makefile recipe is
# exercised in CI (not just `make -n` dry-runs). Prebuilt mode (verified dnix
# assets) on the CI image — no Nix, no source native build. Run from the
# Actions tab with a version + build number; it does not run on every push/PR.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version string (e.g. 0.0.1)'
        required: true
        default: '0.0.1'
      build_number:
        description: 'Build number (integer; must be >= the latest build_* tag)'
        required: true
        default: '326'

jobs:
  verify-toolchain:
    # Runs on the host runner (no container), before the prebuilt image is used,
    # exactly as the build-linux job does. The image's toolchain is frozen at
    # build time, so a raised minimum must fail here, not only once the build
    # has started inside the image. Dart is installed and the toolchain is
    # verified in this same job; the build job needs it to pass.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Dart
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://storage.googleapis.com/download.dartlang.org/linux/debian/dart_linux_signing_key | sudo gpg --dearmor -o /etc/apt/keyrings/dart.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/dart.gpg arch=amd64] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main' | sudo tee /etc/apt/sources.list.d/dart_stable.list
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends dart

      - name: Verify toolchain (pre-image)
        env:
          PATH: ${{ env.PATH }}:/usr/lib/dart/bin
        run: |
          bash scripts/bom_values.sh --check
          dart tool/verify_bom.dart --toolchains

  make-smoke-linux:
    runs-on: ubuntu-24.04
    needs: verify-toolchain
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/stackwallet-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The CI image installs rustup with --default-toolchain none; the pinned
      # toolchains are added on demand by the Flutter build hooks, but
      # `make build-linux` runs verify-bom + check-reqs BEFORE any hook, and
      # those hard-require the BOM-pinned rust toolchains. Install them here,
      # reading the versions from stack-bom.toml so the smoke tracks the BOM.
      - name: Install pinned rust toolchains
        run: |
          rustup toolchain install "$(bash scripts/bom_values.sh --get rust)" --profile minimal
          rustup toolchain install "$(bash scripts/bom_values.sh --get dnssec_rust)" --profile minimal

      - name: Dry-run the recipe
        run: |
          make -n build-linux \
            PLATFORM=Linux TOOLCHAIN=host PREBUILTS=1 SYSTEM_DEPS=1 \
            VERSION="${{ inputs.version }}" BUILD_NUM="${{ inputs.build_number }}"

      - name: Real build (make build-linux, prebuilt)
        run: |
          make build-linux \
            PLATFORM=Linux TOOLCHAIN=host PREBUILTS=1 SYSTEM_DEPS=1 CONFIRM=1 \
            VERSION="${{ inputs.version }}" BUILD_NUM="${{ inputs.build_number }}"

      - name: Upload smoke artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: stack_wallet-linux-smoke-${{ inputs.version }}
          path: build/linux/x64/release/bundle/
