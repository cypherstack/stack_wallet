name: Make build

# Builds with the Makefile targets on the hosted runners. Manual only.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
      - name: Install make
        run: command -v make >/dev/null 2>&1 || choco install make -y --no-progress
      - name: Build
        run: make build-windows VERSION=0.0.0 BUILD_NUM=${{ github.run_number }} WINDOWS_COPY_ASSETS=1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
      - name: Tools
        run: |
          brew install meson ninja autoconf automake libtool protobuf pkg-config cbindgen || true
          rustup toolchain install 1.99.1 --profile minimal || true
          rustup default 1.99.1 || true
      - name: Build
        run: make build-macos VERSION=0.0.0 BUILD_NUM=${{ github.run_number }}

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            automake build-essential clang cmake libclang-dev libtool llvm meson ninja-build patchelf pkg-config protobuf-compiler rsync \
            libgcrypt20-dev libgirepository1.0-dev libgit2-dev libglib2.0-dev libgtk-3-dev libjsoncpp-dev liblzma-dev \
            libncurses5-dev libncursesw5-dev libopencv-dev libsecret-1-dev libssl-dev libtss2-dev \
            ocl-icd-opencl-dev opencl-headers valac zlib1g-dev
      - name: Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Check the toolchain bill of materials
        run: make verify-bom
      - name: Build
        run: make build-linux VERSION=0.0.0 BUILD_NUM=${{ github.run_number }}

  ios:
    # The fork has a single hosted macOS concurrency slot. Running macOS and
    # iOS together leaves one job queued until GitHub cancels it; serialise them.
    needs: macos
    if: always()
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
      - name: Tools
        run: |
          brew install meson ninja autoconf automake libtool protobuf pkg-config cbindgen || true
          rustup toolchain install 1.99.1 --profile minimal || true
          rustup default 1.99.1 || true
      - name: Build
        run: make build-ios VERSION=0.0.0 BUILD_NUM=${{ github.run_number }}
