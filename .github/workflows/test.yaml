name: Test

# Runs on pushes to every branch that carries work, and on pull requests.
#
# dev is where changes land, main is what gets released and what anyone forking
# this repo clones, and upstream-sync is where a Stack Wallet merge is reviewed
# on its own. A suite that guards only one of those guards the wrong one.
#
# It was pull_request only, and every change here lands by pushing straight to
# staging, so the suite last ran on 26 August 2026 and nothing between then and
# now was checked by anything but hand. A test suite that only guards a door
# nobody uses is not guarding anything.
on:
  push:
    branches:
      - main
      - dev
      - staging
      - upstream-sync
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/bitfinitewallet-ci:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Prepare repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure app
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -v "0.0.1" -b "1" -p "linux" -a "bitfinite" -d -s

      - name: Get dependencies
        run: flutter pub get

      - name: Create git_versions.dart stubs
        run: |
          mkdir -p crypto_plugins/flutter_libepiccash/lib
          mkdir -p crypto_plugins/flutter_libmwc/lib

          cat > crypto_plugins/flutter_libepiccash/lib/git_versions.dart << 'EOF'
          String getPluginVersion() => "stub-for-tests";
          EOF

          cat > crypto_plugins/flutter_libmwc/lib/git_versions.dart << 'EOF'
          String getPluginVersion() => "stub-for-tests";
          EOF

      - name: Decode secrets
        env:
          CHANGE_NOW: ${{ secrets.CHANGE_NOW }}
        run: |
          if [ -n "$CHANGE_NOW" ]; then
            echo "$CHANGE_NOW" | base64 --decode > lib/external_api_keys.dart
          else
            cat > lib/external_api_keys.dart << 'EOF'
          const String kChangeNowApiKey = "";
          const String kSimpleSwapApiKey = "";
          const String kNanswapApiKey = "";
          const String kNanoSwapRpcApiKey = "";
          const String kWizSwapApiKey = "";
          const kShopInBitAccessKey = "";
          const kShopInBitPartnerSecret = "";
          const kCakePayApiToken = "";
          const kExolixApiKey = "";
          EOF
          fi

      - name: Ensure app config for tests
        run: bash scripts/ensure_test_app_config.sh

      - name: Create test stubs
        run: bash prebuild.sh
        working-directory: scripts

      - name: Check formatting of changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base ${{ github.event.pull_request.base.sha }} HEAD)
          else
            BASE=${{ github.event.before }}
          fi
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE"..HEAD -- '*.dart')
          if [ -z "$FILES" ]; then
            echo "No Dart files changed."
            exit 0
          fi
          echo "Checking formatting of $(echo "$FILES" | wc -l) file(s):"
          echo "$FILES"
          dart format --output=none --set-exit-if-changed $FILES
      # Errors only, on purpose.
      #
      # `flutter analyze` reports about 2,900 issues here, almost all of them
      # inherited: 680 deprecations, 157 uses of a BuildContext across an async
      # gap, and a long tail of unused imports. Zero are errors. Gating on the
      # whole list would mean either a cleanup nobody has budgeted or a step
      # that is red forever, which is how this one came to be commented out.
      #
      # Gating on errors alone is a check that passes today and genuinely
      # fails when someone breaks the code. The warnings are worth paying down
      # separately; being unable to compile is worth knowing now.
      - name: Analyze (errors only)
        run: |
          flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: |
          bash scripts/ensure_test_app_config.sh
          test -s lib/app_config.g.dart
          grep -Fq "part of 'app_config.dart';" lib/app_config.g.dart
          flutter test --coverage
      - name: Upload to code coverage
        uses: codecov/codecov-action@v1.2.2
        if: success() || failure()
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          file: coverage/lcov.info
