name: Test
on: [pull_request]
jobs:
  windows-build-scripts:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Test Windows prebuild paths and stubs
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/prebuild_windows_test.ps1

  linux-release-bundle:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install ELF test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends binutils build-essential patchelf python3

      - name: Test Linux release bundle preparation
        run: python3 -m unittest discover -s scripts/linux/tests -p 'test_*.py' -v

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/stackwallet-ci:test
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - name: Prepare repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # -d selects verified dnix prebuilts for Frost, Tor, Epic and MWC.
      - name: Configure app (prebuilt native assets)
        run: |
          cd scripts
          echo "yes" | ./build_app.sh -v "0.0.1" -b "1" -p "linux" -a "stack_wallet" -d -s

      - name: Check formatting of changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base ${{ github.event.pull_request.base.sha }} HEAD)
          else
            BASE=${{ github.event.before }}
          fi
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE"..HEAD -- '*.dart')
          if [ -z "$FILES" ]; then
            echo "No Dart files changed."
            exit 0
          fi
          echo "Checking formatting of $(echo "$FILES" | wc -l) file(s):"
          echo "$FILES"
          dart format --output=none --set-exit-if-changed $FILES

      - name: Get dependencies
        run: |
          flutter pub get
          dart tool/check_native_overrides.dart stack_wallet

      - name: Decode secrets
        env:
          CHANGE_NOW: ${{ secrets.CHANGE_NOW }}
        run: |
          if [ -n "$CHANGE_NOW" ]; then
            echo "$CHANGE_NOW" | base64 --decode > lib/external_api_keys.dart
          else
            cat > lib/external_api_keys.dart << 'EOF'
          const String kChangeNowApiKey = "";
          const String kSimpleSwapApiKey = "";
          const String kNanswapApiKey = "";
          const String kNanoSwapRpcApiKey = "";
          const String kWizSwapApiKey = "";
          const kShopInBitAccessKey = "";
          const kShopInBitPartnerSecret = "";
          const kCakePayApiToken = "";
          const kExolixApiKey = "";
          const kLetsExchangeId = "";
          const kLetsExchangeToken = "";
          const kCypherGoatApiKey = "";
          const kCypherGoatAffiliate = "";
          const kTrocadorApiKey = "";
          const kTrocadorRefCode = "";
          EOF
          fi

      - name: Ensure app config for tests
        run: bash scripts/ensure_test_app_config.sh

      - name: Create test stubs
        run: bash prebuild.sh
        working-directory: scripts

#      - name: Analyze
#        run: flutter analyze
      - name: Test build scripts
        run: dart scripts/tests/build_input_test.dart
      - name: Test native build configuration
        run: dart scripts/tests/native_build_config_test.dart
      - name: Test native settings and dependency contracts
        run: |
          dart scripts/tests/configure_native_assets_test.dart
          dart scripts/tests/native_dependency_contract_test.dart
          dart scripts/tests/windows_native_overrides_test.dart
      - name: Test build prerequisites
        run: dart scripts/tests/build_environment_test.dart
      - name: Test Windows secp256k1 helper
        run: dart scripts/tests/windows_secp_build_test.dart
      - name: Test Xcode setup helper
        run: dart scripts/tests/xcode_setup_test.dart
      - name: Test wallet creation launcher
        run: dart scripts/tests/wallet_creation_runner_test.dart
      - name: Test
        run: |
          bash scripts/ensure_test_app_config.sh
          test -s lib/app_config.g.dart
          grep -Fq "part of 'app_config.dart';" lib/app_config.g.dart
          flutter test --coverage
      - name: Upload to code coverage
        uses: codecov/codecov-action@v1.2.2
        if: success() || failure()
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          file: coverage/lcov.info
