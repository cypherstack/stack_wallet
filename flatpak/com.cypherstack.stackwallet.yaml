app-id: com.cypherstack.stackwallet
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: stack_wallet

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --filesystem=~/.stackwallet
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications

modules:
  # Minimal OpenCV build — only the modules needed by camera_linux (VideoCapture + imencode).
  # Keeps the Flatpak from pulling in the full 47-module system OpenCV dependency chain.
  - name: opencv
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_LIST=core,imgcodecs,imgproc,videoio
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_PERF_TESTS=OFF
      - -DBUILD_DOCS=OFF
      - -DBUILD_opencv_python3=OFF
      - -DBUILD_opencv_python_bindings_generator=OFF
      - -DWITH_GTK=OFF
      - -DWITH_QT=OFF
      - -DWITH_OPENGL=OFF
      - -DWITH_OPENCL=OFF
      - -DWITH_CUDA=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_GSTREAMER=OFF
      - -DWITH_V4L=ON
      - -DWITH_LIBV4L=ON
    sources:
      - type: git
        url: https://github.com/opencv/opencv
        tag: '4.10.0'
        commit: 71d3237a093b60a27601c20e9ee6c3e52154e8b1

  # Install the pre-built Flutter bundle.
  - name: stack_wallet
    buildsystem: simple
    build-commands:
      # Install the pre-built Flutter bundle under /app/lib/stack_wallet/ so
      # the binary's $ORIGIN/lib and $ORIGIN/data lookups resolve correctly.
      - mkdir -p /app/lib/stack_wallet
      - install -Dm755 bundle/stack_wallet /app/lib/stack_wallet/stack_wallet
      - cp -r bundle/lib bundle/data /app/lib/stack_wallet/
      # Wrapper script so the Flatpak command path resolves to the binary.
      - install -Dm755 stack_wallet.sh /app/bin/stack_wallet
      - install -Dm644 com.cypherstack.stackwallet.desktop
          /app/share/applications/com.cypherstack.stackwallet.desktop
      - install -Dm644 com.cypherstack.stackwallet.metainfo.xml
          /app/share/metainfo/com.cypherstack.stackwallet.metainfo.xml
      - install -Dm644 com.cypherstack.stackwallet.png
          /app/share/icons/hicolor/512x512/apps/com.cypherstack.stackwallet.png
    sources:
      - type: dir
        path: .

  # Rebuild camera_linux and its OpenCV wrapper against the Flatpak-built OpenCV above,
  # then overwrite the pre-built CI libs dropped by the stack_wallet module.
  # RPATH includes both the app lib dir (for libopencv_wrapper.so) and /app/lib
  # (for the OpenCV modules installed by the opencv module above).
  - name: camera-linux
    buildsystem: simple
    build-commands:
      - cmake -S src -B _build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=/app
          -DCMAKE_INSTALL_RPATH=/app/lib/stack_wallet/lib:/app/lib
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
      - cmake --build _build --parallel
      - install -Dm755 _build/libopencv_wrapper.so
          /app/lib/stack_wallet/lib/libopencv_wrapper.so
      - install -Dm755 _build/libcamera_linux.so
          /app/lib/stack_wallet/lib/libcamera_linux.so
    sources:
      - type: git
        url: https://github.com/cypherstack/camera-linux
        commit: ecb412474c5d240347b04ac1eb9f019802ff7034
