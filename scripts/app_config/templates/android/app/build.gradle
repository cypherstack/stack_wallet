plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // The namespace matches the (hardcoded) MainActivity package under
    // android/app/src/main/kotlin/com/cypherstack/stackwallet. It is the same
    // for all brands; per-brand application ids are set by the product
    // flavors below.
    namespace "com.cypherstack.stackwallet"
    compileSdk 37
//    ndkVersion flutter.ndkVersion
    ndkVersion = "28.2.13676358"

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    defaultConfig {
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
            coreLibraryDesugaringEnabled true
        }

        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_17
        }

        dependencies {
            coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
        }

        // No ndk.abiFilters here: AGP rejects it alongside the abi splits set
        // up by `flutter build apk --split-per-abi`. Flutter defaults to
        // android-arm,android-arm64,android-x64 which is the same set we want.

//        externalNativeBuild {
//            cmake {
//                arguments "-DANDROID_STL=c++_shared", '-DBUILD_TESTING=OFF', "-DANDROID_TOOLCHAIN=clang -v"
//                cppFlags "-frtti -fexceptions -v -DANDROID -std=c++17"
////                cppFlags "-std=c++11"
//                version "3.10.2"
//            }
//        }
    }

    // Brand identity is expressed as Gradle product flavors so that
    // `flutter build apk --flavor <brand>` works without any sed-style
    // rewriting. Keep these in sync with the brand manifests in the
    // whitelabel package (whitelabel/brands/*.yaml).
    flavorDimensions "brand"
    productFlavors {
        stack_wallet {
            dimension "brand"
            applicationId "com.cypherstack.stackwallet"
            manifestPlaceholders = [appLabel: "Stack Wallet"]
        }
        stack_duo {
            dimension "brand"
            applicationId "com.cypherstack.stackduo"
            manifestPlaceholders = [appLabel: "Stack Duo"]
        }
        campfire {
            dimension "brand"
            applicationId "com.cypherstack.campfire"
            manifestPlaceholders = [appLabel: "Campfire"]
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            ndk {
                debugSymbolLevel 'FULL'
            }

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    // not required. Just info
    tasks.whenTaskAdded { task ->
        if (task.name == 'assembleDebug') {
            task.doFirst {
                println "The compileSdkVersion is $android.compileSdk"
                println "The targetSdkVersion is $flutter.targetSdkVersion"
                println "The ndkVersion is $ndkVersion"
            }
        }
    }
}

flutter {
    source '../..'
}