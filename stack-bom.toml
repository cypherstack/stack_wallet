# Stack Wallet build bill of materials: the toolchain a build is expected to use.
# Checked by `make verify-bom` (dart tool/verify_bom.dart). Keep it small and human readable.
schema_version = 1

[toolchain]
flutter = "3.47.4"       # recommended; macOS builds verified with 3.47.2 and 3.47.4
flutter_min = "3.47.2"   # what CI and pubspec.template.yaml use today
dart_prefix = "3.13"     # Dart bundled with Flutter 3.47.x
rust = "1.99.1"          # installed through rustup, pinned by the native plugins
go_min = "1.24"          # flutter_mwebd

[hooks]
hooks_runner = "1.5.0"   # pinned by Flutter 3.47.x; CARGO_/RUSTUP_ env vars reach hooks only from 1.6.2

[macos]
xcode = "27.1"           # recommended for app builds
xcode_build = "27A9275"
xcode_dnix = "27.0"      # dnix needs this one to rebuild Apple libraries byte for byte
xcode_xip_sha1 = "d8b1d16397e6f2faab34bd48b19692a3f7797b9d"   # archive.org item xcode-27.1, see scripts/download_xcode.sh

[plugins]
# Generated by `dart tool/verify_bom.dart --update` from pubspec.lock. Do not edit by hand.
flutter_libepiccash = "63e93b01c3c4c68a52b26a43e4442a4738d5e7e8"
flutter_libmwc = "5722fb3ba05c8f52e8e0255c485ae5ea52e9a694"
flutter_libsparkmobile = "3fdcb21160a39c051a0e73d7ae04f987134ecd5f"
frostdart = "f7fea2a926ea88e2eb6a353579372188d6915314"
tor_ffi_plugin = "6e954a9d5a0aaaafb861049b79041d7ae98c2a08"
xelis_wallet_flutter = "8630a2cf28947497ec67b7535ddf1fac4cedbaa8"
