    shell: linux
    build:
      command: flutter build linux --release
      output: build/linux/x64/release/bundle/
  android:
    shell: android
    sdk:
      cmdline_tools_build: "14742923"
      cmdline_tools_sha256_linux: "04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7"
