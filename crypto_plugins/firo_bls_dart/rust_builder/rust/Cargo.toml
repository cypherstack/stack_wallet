[package]
name = "rust_lib_bls_dart"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
blst = { version = "0.3", features = ["portable"] }
dash-pkc = { version = "0.2.0-beta", default-features = false, features = ["bls", "portable"] }
zeroize = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
