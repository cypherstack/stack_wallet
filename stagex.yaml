    source_sha256: "1ec1cba65f9f20fe5a41fda1586e01c70ea0c9a6d7b67c9e13edf0cfe2239277"

platforms:
  linux:
    containerfile: containerfiles/linux/Containerfile
    build:
      command: flutter build linux --release
      output: build/linux/x64/release/bundle
    env:
      SOURCE_DATE_EPOCH: "1"
      PERL_HASH_SEED: "0"
      PERL_PERTURB_KEYS: "0"
      CFLAGS: "-Wdate-time -ffile-prefix-map=/workspace=."
      CXXFLAGS: "-Wdate-time -ffile-prefix-map=/workspace=."
      LDFLAGS: "-Wl,--build-id=sha1"
  android:
    containerfile: containerfiles/android/Containerfile
    build:
      command: flutter build apk --release
      output: build/app/outputs/flutter-apk/app-release.apk
    sdk:
      cmdline_tools_build: "14742923"
      cmdline_tools_sha256: "04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7"
      platform_version: android-36
      build_tools_version: "35.0.0"
      ndk_version: "28.2.13676358"
    env:
      SOURCE_DATE_EPOCH: "1"
      PERL_HASH_SEED: "0"
      PERL_PERTURB_KEYS: "0"
      STACK_ALLOW_UNSIGNED_ANDROID: "1"
  macos:
    host: macos
    build:
      command: flutter build macos --release
      output: build/macos/Build/Products/Release/Stack Wallet.app
    env:
      SOURCE_DATE_EPOCH: "1"
      PERL_HASH_SEED: "0"
      PERL_PERTURB_KEYS: "0"
  ios:
    host: macos
    build:
      command: flutter build ios --release --no-codesign
      output: build/ios/iphoneos/Runner.app
    env:
      SOURCE_DATE_EPOCH: "1"
      PERL_HASH_SEED: "0"
      PERL_PERTURB_KEYS: "0"
  windows:
    host: windows-wsl
    build:
      command: contrib/stagex/scripts/build-windows.sh
      output: build/windows/x64/runner/Release
    env:
      SOURCE_DATE_EPOCH: "1"
      PERL_HASH_SEED: "0"
      PERL_PERTURB_KEYS: "0"
